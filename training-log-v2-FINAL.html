<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FF Training">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22FF%20Training%22%2C%22short_name%22%3A%22FF%20Training%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f1117%22%2C%22theme_color%22%3A%22%230f1117%22%2C%22start_url%22%3A%22.%2F%22%7D">
<title>FF Training v2</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #181c25;
  --surface2: #1e2330;
  --border: #2a2f3d;
  --text: #e8eaf0;
  --text2: #8b90a0;
  --text3: #555a6b;
  --push: #4a9eff;
  --pull: #ff7043;
  --legs: #43c97e;
  --perf: #b06eff;
  --def: #ffb830;
  --run: #00d4b8;
  --danger: #ff4757;
  --radius: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; min-height: 100dvh; overflow-x: hidden; }
.safe-top { height: var(--safe-top); background: var(--bg); }
/* NAV */
.tab-bar { display: flex; background: var(--surface); border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: var(--safe-bot); z-index: 100; }
.tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border: none; background: none; color: var(--text3); font-size: 10px; cursor: pointer; transition: color 0.15s; }
.tab-btn svg { width: 22px; height: 22px; }
.tab-btn.active { color: var(--push); }
.tab-btn.run-tab.active { color: var(--run); }
.tab-btn.guide-tab.active { color: var(--text2); }
/* HEADER */
.page-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.page-header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.page-header .sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
/* CONTENT */
.page { display: none; padding-bottom: calc(70px + var(--safe-bot)); }
.page.active { display: block; }
/* WEEK HEADER */
.week-header { margin: 12px 16px 0; }
.week-badge { display: flex; align-items: center; gap: 8px; }
.week-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
.week-dates { font-size: 11px; color: var(--text3); }
.phase-label { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: var(--surface2); }
/* WEEK NAV */
.week-nav { display: flex; align-items: center; gap: 0; margin: 12px 16px 0; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); }
.week-nav-btn { background: none; border: none; color: var(--text2); padding: 12px 14px; cursor: pointer; display: flex; align-items: center; flex-shrink: 0; }
.week-nav-btn:disabled { color: var(--text3); cursor: default; }
.week-nav-btn:not(:disabled):active { background: var(--surface2); }
.week-nav-center { flex: 1; text-align: center; padding: 10px 0; }
.week-nav-label { font-size: 16px; font-weight: 700; }
.week-nav-phase { font-size: 13px; font-weight: 700; }
.week-nav-dates { font-size: 11px; color: var(--text3); margin-top: 2px; }
/* STATS BAR */
.stats-bar { display: flex; gap: 0; margin: 12px 16px 0; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.stat-cell { flex: 1; padding: 10px 8px; text-align: center; border-right: 1px solid var(--border); }
.stat-cell:last-child { border-right: none; }
.stat-val { font-size: 16px; font-weight: 700; }
.stat-lbl { font-size: 10px; color: var(--text3); margin-top: 1px; }
/* DAY CARDS */
.day-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.day-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.day-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
.day-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.day-title { font-size: 15px; font-weight: 700; flex: 1; }
.day-meta { font-size: 11px; color: var(--text2); }
.day-chevron { color: var(--text3); font-size: 16px; transition: transform 0.2s; }
.day-card.open .day-chevron { transform: rotate(90deg); }
.day-body { display: none; padding: 0 14px 14px; }
.day-card.open .day-body { display: block; }
/* SESSION NOTE */
.session-note-wrap { margin-bottom: 12px; }
.note-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.note-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: 13px; resize: none; min-height: 52px; font-family: inherit; }
.note-input:focus { outline: none; border-color: var(--text3); }
/* EXERCISE ROWS */
.ex-row { background: var(--bg); border-radius: 8px; margin-bottom: 8px; overflow: hidden; border: 1px solid var(--border); }
.ex-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 10px; }
.ex-name { font-size: 14px; font-weight: 600; flex: 1; }
.ex-target { font-size: 11px; color: var(--text2); }
.ex-swap-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; color: var(--text2); font-size: 11px; cursor: pointer; flex-shrink: 0; }
.ex-muscles-primary { font-size: 11px; font-weight: 700; color: var(--text2); margin-top: 3px; }
.ex-muscles-secondary { font-size: 10px; color: var(--text3); margin-top: 1px; }
.ex-note-text { font-size: 11px; color: var(--text3); padding: 0 12px 6px; font-style: italic; }
.ex-user-note-wrap { padding: 0 12px 8px; }
.ex-user-note { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; color: var(--text); font-size: 12px; resize: none; min-height: 36px; font-family: inherit; }
.ex-user-note:focus { outline: none; border-color: var(--text3); }
.sets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; padding: 0 12px 12px; }
.set-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: var(--surface2); border: 2px solid var(--border); border-radius: 8px; padding: 8px 4px; cursor: pointer; transition: all 0.15s; }
.set-btn.done { background: #1a2a1a; border-color: var(--legs); }
.set-label { font-size: 11px; color: var(--text2); font-weight: 600; }
.set-weight-input { width: 52px; background: transparent; border: none; text-align: center; color: var(--text); font-size: 14px; font-weight: 700; padding: 0; font-family: inherit; }
.set-weight-input:focus { outline: none; }
.set-btn.done .set-label { color: var(--legs); }
.nudge-badge { display: inline-block; background: rgba(67,201,126,0.15); color: var(--legs); border: 1px solid rgba(67,201,126,0.3); border-radius: 4px; font-size: 10px; font-weight: 700; padding: 2px 6px; margin: 0 12px 10px; }
/* SWAP MODAL */
.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; }
.modal-backdrop.open { display: flex; align-items: flex-end; }
.modal { background: var(--surface); border-radius: 16px 16px 0 0; width: 100%; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
.modal-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
.modal-title { font-size: 16px; font-weight: 700; flex: 1; }
.modal-close { background: var(--surface2); border: none; border-radius: 50%; width: 28px; height: 28px; color: var(--text2); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-filters { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; flex-shrink: 0; }
.filter-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: var(--text2); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.filter-chip.active { background: var(--push); border-color: var(--push); color: #fff; }
.modal-list { overflow-y: auto; flex: 1; }
.swap-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; }
.swap-item:active { background: var(--surface2); }
.swap-item-name { font-size: 14px; font-weight: 600; flex: 1; }
.swap-item-tags { display: flex; gap: 4px; }
.eq-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }
.eq-tag.full { color: var(--push); border-color: rgba(74,158,255,0.3); background: rgba(74,158,255,0.1); }
.eq-tag.db { color: var(--def); border-color: rgba(255,184,48,0.3); background: rgba(255,184,48,0.1); }
.eq-tag.bw { color: var(--legs); border-color: rgba(67,201,126,0.3); background: rgba(67,201,126,0.1); }
/* WEEK NOTE */
.week-note-section { margin: 0 16px 12px; }
.week-note-section .note-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
/* RUNNING PAGE */
.run-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px; }
.run-header h1 { font-size: 18px; font-weight: 700; }
.run-header .sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.run-log-form { margin: 12px 16px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; }
.run-form-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
.run-field { margin-bottom: 12px; }
.run-field label { display: block; font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.run-field input, .run-field select, .run-field textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; font-family: inherit; }
.run-field input:focus, .run-field select:focus, .run-field textarea:focus { outline: none; border-color: var(--text3); }
.run-field textarea { resize: none; min-height: 60px; }
.run-field select option { background: var(--surface2); }
.run-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.log-run-btn { width: 100%; background: var(--run); border: none; border-radius: var(--radius); padding: 13px; color: #0f1117; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
.run-history { margin: 0 16px 16px; }
.run-history-title { font-size: 14px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
.run-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 12px 14px; margin-bottom: 8px; }
.run-card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.run-card-date { font-size: 12px; color: var(--text3); }
.run-card-dist { font-size: 22px; font-weight: 800; }
.run-card-dist span { font-size: 13px; font-weight: 400; color: var(--text2); }
.run-stats-row { display: flex; gap: 16px; margin-top: 6px; }
.run-stat { font-size: 12px; color: var(--text2); }
.run-stat strong { color: var(--text); }
.run-feel-chip { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: var(--surface2); }
.run-note-text { font-size: 12px; color: var(--text3); margin-top: 6px; font-style: italic; }
.run-delete { background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; margin-left: auto; }
/* GUIDE PAGE */
.guide-section { margin: 0 16px 10px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.guide-section-header { display: flex; align-items: center; padding: 14px; cursor: pointer; gap: 10px; }
.guide-section-title { font-size: 14px; font-weight: 700; flex: 1; }
.guide-section-chevron { color: var(--text3); font-size: 16px; transition: transform 0.2s; }
.guide-section.open .guide-section-chevron { transform: rotate(90deg); }
.guide-section-body { display: none; padding: 0 14px 14px; }
.guide-section.open .guide-section-body { display: block; }
.guide-section-body p, .guide-section-body li { font-size: 13px; color: var(--text2); line-height: 1.6; }
.guide-section-body ul { padding-left: 16px; }
.guide-section-body h4 { font-size: 12px; font-weight: 700; color: var(--text); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.guide-section-body .phase-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.guide-section-body .phase-row:last-child { border-bottom: none; }
.guide-section-body .phase-wk { width: 52px; font-size: 12px; font-weight: 700; color: var(--push); flex-shrink: 0; }
.guide-section-body .phase-name { font-size: 12px; font-weight: 700; color: var(--text); }
.guide-section-body .phase-desc { font-size: 12px; color: var(--text2); }
/* EDIT MODE BANNER */
.edit-mode-banner { background: rgba(255,71,87,0.12); border-bottom: 1px solid rgba(255,71,87,0.3); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.edit-mode-text { font-size: 12px; color: #ff8a95; flex: 1; }
.edit-mode-done { background: var(--danger); border: none; border-radius: 6px; padding: 5px 12px; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
.ex-delete-btn { background: rgba(255,71,87,0.15); border: 1px solid rgba(255,71,87,0.3); border-radius: 6px; padding: 4px 8px; color: #ff8a95; font-size: 11px; cursor: pointer; }
/* EDIT MODE CONTROLS */
.add-ex-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; background: var(--surface2); border: 1px dashed var(--border); border-radius: 8px; padding: 10px; color: var(--text3); font-size: 13px; cursor: pointer; margin-bottom: 8px; }
/* WEEK NOTE */
.week-note-area { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 13px; resize: none; min-height: 56px; font-family: inherit; }
.week-note-area:focus { outline: none; border-color: var(--text3); }
/* MISC */
.empty-state { text-align: center; padding: 40px 24px; color: var(--text3); font-size: 14px; }
.empty-state svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: 0.3; }
.section-spacer { height: 12px; }
</style>
</head>
<body>
<div class="safe-top"></div>
<div id="app"></div>
<div class="tab-bar" id="tab-bar"></div>
<div id="swap-modal" class="modal-backdrop"></div>
<script>
// ─── CONSTANTS ──────────────────────────────────────────────
const STORAGE_KEY = 'ff-v2-main';
const PROGRAM_START = new Date(2026, 9, 15); // Oct 15 2026 — continues from v1

// ─── PHASES (open-ended: cycles after week 6) ────────────────
const PHASES = [
  { label: "Reload",    wks: [1,2],  mainReps: "12-15", accReps: "15",   note: "Light reload — build back in. Perfect form, no ego." },
  { label: "Strength",  wks: [3,4],  mainReps: "6-8",   accReps: "10",   note: "Push heavy on main lifts. Rest 2-3 min between sets." },
  { label: "Hypertrophy",wks:[5,6],  mainReps: "10-12", accReps: "12-15",note: "Volume focus. Keep rest to 60-90s, feel the pump." },
];

function getPhaseForWeek(w) {
  // cycles every 6 weeks
  const cycleWeek = ((w - 1) % 6) + 1;
  if (cycleWeek <= 2) return PHASES[0];
  if (cycleWeek <= 4) return PHASES[1];
  return PHASES[2];
}

function getCycleNum(w) { return Math.floor((w - 1) / 6) + 1; }

// ─── EXERCISE DATABASE ───────────────────────────────────────
// equipment: "full" = cables/machines/barbells, "db" = dumbbells only, "bw" = bodyweight
const EXERCISE_DB = [
  // PUSH / CHEST
  { id:"db1",  name:"Incline DB Press",         cat:"push",  eq:["full","db"], muscles:{primary:["Upper Chest"],secondary:["Front Delt","Triceps"]}, note:"30-45° angle, elbows 45° out" },
  { id:"db2",  name:"Low-to-High Cable Fly",    cat:"push",  eq:["full"],      muscles:{primary:["Upper Chest"],secondary:["Front Delt"]}, note:"Targets upper chest clavicular head" },
  { id:"db3",  name:"Cable Crossover High",     cat:"push",  eq:["full"],      muscles:{primary:["Lower/Mid Chest"],secondary:["Front Delt"]}, note:"Arms slightly bent, squeeze at bottom" },
  { id:"db4",  name:"Push-Up (Feet Elevated)",  cat:"push",  eq:["full","db","bw"], muscles:{primary:["Upper Chest"],secondary:["Front Delt","Triceps"]}, note:"Feet on bench, hits upper chest" },
  { id:"db5",  name:"DB Flat Press",            cat:"push",  eq:["full","db"], muscles:{primary:["Mid Chest"],secondary:["Front Delt","Triceps"]}, note:"Full range of motion" },
  { id:"db6",  name:"DB Incline Fly",           cat:"push",  eq:["full","db"], muscles:{primary:["Upper Chest"],secondary:["Front Delt"]}, note:"Slight bend in elbows, deep stretch" },
  { id:"db7",  name:"Machine Chest Press",      cat:"push",  eq:["full"],      muscles:{primary:["Mid Chest"],secondary:["Front Delt","Triceps"]}, note:"Good for high rep pump sets" },
  { id:"db8",  name:"Chest Dips (Leaning Fwd)", cat:"push",  eq:["full","bw"], muscles:{primary:["Lower Chest"],secondary:["Triceps","Front Delt"]}, note:"Lean forward to bias chest over triceps" },
  // SHOULDER
  { id:"sh1",  name:"DB Lateral Raise",         cat:"push",  eq:["full","db"], muscles:{primary:["Side Delt"],secondary:["Traps (upper)"]}, note:"Slight forward tilt, lead with elbows" },
  { id:"sh2",  name:"Cable Lateral Raise",      cat:"push",  eq:["full"],      muscles:{primary:["Side Delt"],secondary:["Traps (upper)"]}, note:"Cable = constant tension throughout" },
  { id:"sh3",  name:"DB Overhead Press",        cat:"push",  eq:["full","db"], muscles:{primary:["Front Delt","Side Delt"],secondary:["Triceps","Traps"]}, note:"Seated or standing, core braced" },
  { id:"sh4",  name:"Machine Shoulder Press",   cat:"push",  eq:["full"],      muscles:{primary:["Front Delt","Side Delt"],secondary:["Triceps"]}, note:"Controlled eccentric, no lockout" },
  { id:"sh5",  name:"Face Pull",                cat:"push",  eq:["full"],      muscles:{primary:["Rear Delt"],secondary:["External Rotators","Traps (mid)"]}, note:"Crucial for shoulder health + rear delt" },
  { id:"sh6",  name:"DB Arnold Press",          cat:"push",  eq:["full","db"], muscles:{primary:["Front Delt","Side Delt"],secondary:["Triceps","Rotator Cuff"]}, note:"Great for shoulder rotation + mass" },
  { id:"sh7",  name:"Plate Front Raise",        cat:"push",  eq:["full"],      muscles:{primary:["Front Delt"],secondary:["Side Delt","Traps"]}, note:"Slow and controlled, front delt" },
  { id:"sh8",  name:"Reverse Pec Deck",         cat:"push",  eq:["full"],      muscles:{primary:["Rear Delt"],secondary:["Rhomboids","Traps (mid)"]}, note:"Rear delt isolation, squeeze at peak" },
  // TRICEPS
  { id:"tri1", name:"Tricep Rope Pushdown",     cat:"push",  eq:["full"],      muscles:{primary:["Triceps (lateral head)"],secondary:["Triceps (medial)"]}, note:"Elbows fixed, spread rope at bottom" },
  { id:"tri2", name:"Overhead Tricep Extension",cat:"push",  eq:["full","db"], muscles:{primary:["Triceps (long head)"],secondary:["Triceps (lateral)"]}, note:"DB or cable, long head emphasis" },
  { id:"tri3", name:"Skull Crusher (EZ-bar)",   cat:"push",  eq:["full"],      muscles:{primary:["Triceps (long head)","Triceps (medial)"],secondary:[]}, note:"Keep elbows pointing up, not flared" },
  { id:"tri4", name:"Diamond Push-Up",          cat:"push",  eq:["bw","full","db"], muscles:{primary:["Triceps"],secondary:["Inner Chest","Front Delt"]}, note:"Hands close together, straight body" },
  { id:"tri5", name:"Tricep Dip (Bench)",       cat:"push",  eq:["full","bw"], muscles:{primary:["Triceps"],secondary:["Front Delt","Lower Chest"]}, note:"Feet on floor or elevated" },
  // PULL / BACK
  { id:"pu1",  name:"Lat Pulldown (Wide)",      cat:"pull",  eq:["full"],      muscles:{primary:["Lats"],secondary:["Biceps","Rear Delt","Rhomboids"]}, note:"Pull to chin, squeeze lats at bottom" },
  { id:"pu2",  name:"Cable Seated Row",         cat:"pull",  eq:["full"],      muscles:{primary:["Mid Back","Lats"],secondary:["Biceps","Rear Delt"]}, note:"Chest up, elbows back, 2s hold" },
  { id:"pu3",  name:"DB Single-Arm Row",        cat:"pull",  eq:["full","db"], muscles:{primary:["Lats","Mid Back"],secondary:["Biceps","Rear Delt"]}, note:"Elbow high, full lat stretch" },
  { id:"pu4",  name:"Pull-Up / Assisted",       cat:"pull",  eq:["full","bw"], muscles:{primary:["Lats"],secondary:["Biceps","Rear Delt","Core"]}, note:"Full dead hang, chin over bar" },
  { id:"pu5",  name:"Face Pull (Rear Delt)",    cat:"pull",  eq:["full"],      muscles:{primary:["Rear Delt"],secondary:["External Rotators","Traps (mid)"]}, note:"External rotation at end" },
  { id:"pu6",  name:"Machine Row",              cat:"pull",  eq:["full"],      muscles:{primary:["Mid Back","Lats"],secondary:["Biceps","Rear Delt"]}, note:"Chest pad, retract scapula" },
  { id:"pu7",  name:"Neutral Grip Pulldown",    cat:"pull",  eq:["full"],      muscles:{primary:["Lats"],secondary:["Biceps","Brachialis"]}, note:"V-bar, close grip, bicep-friendly" },
  { id:"pu8",  name:"Straight Arm Pulldown",    cat:"pull",  eq:["full"],      muscles:{primary:["Lats"],secondary:["Teres Major","Rear Delt"]}, note:"Arms straight, lat isolation" },

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      Object.assign(state, saved);
      // reset non-persistent UI
      state.activeTab = state.activeTab || 'log';
      state.swapTarget = null;
      state.editMode = false;
    }
  } catch(e) {}
}

function saveState() {
  try {
    const toSave = {
      progress: state.progress,
      exNotes: state.exNotes,
      sessionNotes: state.sessionNotes,
      weekNotes: state.weekNotes,
      runs: state.runs,
      customDays: state.customDays,
      guideExpanded: state.guideExpanded,
      openDay: state.openDay,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch(e) {}
}

// ─── PROGRAM HELPERS ─────────────────────────────────────────
function getCurrentWeek() {
  const now = new Date();
  const diff = now - PROGRAM_START;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  return Math.max(1, Math.floor(days / 7) + 1);
}

function getWeekRange(w) {
  const start = new Date(PROGRAM_START);
  start.setDate(start.getDate() + (w - 1) * 7);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  const fmt = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  return `${fmt(start)} – ${fmt(end)}`;
}

function getDayDef(dayId) {
  const base = DAYS.find(d => d.id === dayId);
  if (!base) return null;
  const custom = state.customDays[dayId];
  if (!custom) return base;
  return { ...base, ...custom, exercises: custom.exercises || base.exercises };
}

function repTarget(ex, week) {
  if (ex.kind === 'fixed') return ex.target;
  const phase = getPhaseForWeek(week);
  const reps = ex.kind === 'main' ? phase.mainReps : phase.accReps;
  return `${ex.sets} × ${reps}`;
}

function getStorageKey(week, dayId) { return `w${week}-${dayId}`; }

function getSets(week, dayId, exId, count) {
  const key = getStorageKey(week, dayId);
  const dayData = (state.progress[key] || {});
  const sets = dayData[exId] || [];
  // pad to count
  while (sets.length < count) sets.push({ done: false, weight: '' });
  return sets.slice(0, count);
}

function getLastWeekWeight(week, dayId, exId) {
  // returns {weight, fromWeek} or null — scans all prior weeks, not just week-1
  for (let w = week - 1; w >= 1; w--) {
    const key = getStorageKey(w, dayId);
    const dayData = state.progress[key] || {};
    const sets = dayData[exId] || [];
    const weights = sets.filter(s => s.weight && s.weight !== '').map(s => parseFloat(s.weight)).filter(n => !isNaN(n));
    if (weights.length) return { weight: Math.max(...weights), fromWeek: w };
  }
  return null;
}

function allSetsDoneLastWeek(week, dayId, exId, count) {
  if (week <= 1) return false;
  const key = getStorageKey(week - 1, dayId);
  const dayData = state.progress[key] || {};
  const sets = (dayData[exId] || []).slice(0, count);
  return sets.length === count && sets.every(s => s.done);
}

function getDaysDone(week) {
  return DAYS.filter(d => {
    const key = getStorageKey(week, d.id);
    const dayData = state.progress[key] || {};
    const day = getDayDef(d.id);
    return day.exercises.some(ex => {
      const sets = dayData[ex.id] || [];
      return sets.some(s => s.done);
    });
  }).length;
}

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  const currentWeek = getCurrentWeek();
  const week = state.viewWeek !== null ? state.viewWeek : currentWeek;
  const isCurrentWeek = week === currentWeek;
  const phase = getPhaseForWeek(week);
  const cycle = getCycleNum(week);
  const cycleWeek = ((week - 1) % 6) + 1;
  const daysDone = getDaysDone(week);

  let html = '';

  // ── LOG TAB ──
  html += `<div class="page ${state.activeTab === 'log' ? 'active' : ''}" id="page-log">`;
  if (state.editMode) {
    html += `<div class="edit-mode-banner">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;color:#ff8a95"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      <span class="edit-mode-text">Edit mode — swap exercises permanently or reorder days</span>
      <button class="edit-mode-done" onclick="toggleEditMode()">Done</button>
    </div>`;
  }
  html += `<div class="page-header">
    <h1>FF Training</h1>
    <div class="sub">${phase.label} phase · Cycle ${cycle} · ${phase.note}</div>
  </div>`;

  // stats bar
  html += `<div class="stats-bar">
    <div class="stat-cell"><div class="stat-val">W${week}</div><div class="stat-lbl">Total Wk</div></div>
    <div class="stat-cell"><div class="stat-val">${cycleWeek}/6</div><div class="stat-lbl">Cycle Wk</div></div>
    <div class="stat-cell"><div class="stat-val">${daysDone}/5</div><div class="stat-lbl">Days Done</div></div>
    <div class="stat-cell" style="cursor:pointer" onclick="toggleEditMode()">
      <div class="stat-val" style="font-size:13px">${state.editMode ? '✓ Done' : '✏️'}</div>
      <div class="stat-lbl">${state.editMode ? 'Exit Edit' : 'Edit Plan'}</div>
    </div>
  </div>`;

  // week navigator
  html += `<div class="week-nav">
    <button class="week-nav-btn" onclick="changeWeek(-1)" ${week <= 1 ? 'disabled' : ''}>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="week-nav-center">
      <div class="week-nav-label">Week ${week} <span class="week-nav-phase" style="color:${TYPE_COLOR[week % 6 <= 2 ? 'push' : week % 6 <= 4 ? 'pull' : 'legs']}">${phase.label}</span></div>
      <div class="week-nav-dates">Cycle ${cycle}${!isCurrentWeek ? ` · <span style="color:var(--run);font-weight:700;cursor:pointer" onclick="jumpToToday()">Back to today</span>` : ''}</div>
    </div>
    <button class="week-nav-btn" onclick="changeWeek(1)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>`;

  // week note
  html += `<div class="week-note-section" style="margin:10px 16px 4px">
    <div class="note-label">Week ${week} Notes</div>
    <textarea class="week-note-area" placeholder="How's this week feeling? Any injuries, PRs, energy levels…"
      oninput="updateWeekNote(${week}, this.value)">${state.weekNotes[`w${week}`] || ''}</textarea>
  </div>`;

  // day cards
  html += `<div class="day-list">`;
  for (const dayBase of DAYS) {
    const day = getDayDef(dayBase.id);
    const isOpen = state.openDay === day.id;
    const color = TYPE_COLOR[day.type];
    const key = getStorageKey(week, day.id);
    const dayData = state.progress[key] || {};
    const doneCount = day.exercises.reduce((acc, ex) => {
      const sets = (dayData[ex.id] || []).filter(s => s.done).length;
      return acc + sets;
    }, 0);
    const totalSets = day.exercises.reduce((a, ex) => a + ex.sets, 0);

    html += `<div class="day-card ${isOpen ? 'open' : ''}" id="card-${day.id}">

      // exercises
      for (const ex of day.exercises) {
        const dbEx = dbById(ex.dbId);

        const setsArr = getSets(week, day.id, ex.id, ex.sets);
        const lastWtData = getLastWeekWeight(week, day.id, ex.id);
        const lastWt = lastWtData ? lastWtData.weight : null;
        const lastWtWeek = lastWtData ? lastWtData.fromWeek : null;
        const isLastWeek = lastWtWeek === week - 1;
        const shouldNudge = isLastWeek && allSetsDoneLastWeek(week, day.id, ex.id, ex.sets);

        const primaryMuscles = dbEx.muscles ? dbEx.muscles.primary.join(' · ') : '';
        const secondaryMuscles = dbEx.muscles ? dbEx.muscles.secondary.join(', ') : '';
        html += `<div class="ex-row" id="exrow-${day.id}-${ex.id}">
          <div class="ex-header">
            <div style="flex:1;min-width:0">
              <div class="ex-name">${dbEx.name}</div>

              ${primaryMuscles ? `<div class="ex-muscles-primary">${primaryMuscles}</div>` : ''}
              ${secondaryMuscles ? `<div class="ex-muscles-secondary">+ ${secondaryMuscles}</div>` : ''}
            </div>`;
        if (state.editMode) {

function renderSwapModal() { return ''; }

function renderSwapModalContent() {
  const target = state.swapTarget;
  const filterButtons = [
    { key:'all', label:'All' },
    { key:'push', label:'Push' },
    { key:'pull', label:'Pull' },
    { key:'legs', label:'Legs' },
    { key:'core', label:'Core' },
    { key:'perf', label:'Athletic' },
    { key:'full', label:'Full Gym' },
    { key:'db',   label:'DBs Only' },
    { key:'bw',   label:'Bodyweight' },
  ];

  const cats = ['push','pull','legs','core','perf'];
  const eqs = ['full','db','bw'];

  let filtered = EXERCISE_DB;
  const f = state.swapFilter;
  if (cats.includes(f)) filtered = filtered.filter(e => e.cat === f);
  else if (eqs.includes(f)) filtered = filtered.filter(e => e.eq.includes(f));

  // If adding (target.exId === null), show all. If swapping, prefer same cat
  const isAdd = target && target.exId === null;
  const currentDay = getDayDef(target ? target.dayId : '');
  const currentEx = currentDay && target && target.exId
    ? currentDay.exercises.find(e => e.id === target.exId)
    : null;
  const currentDbEx = currentEx ? dbById(currentEx.dbId) : null;

  let html = `<div class="modal">
    <div class="modal-header">
      <div class="modal-title">${isAdd ? 'Add Exercise' : `Swap: ${currentDbEx ? currentDbEx.name : 'Exercise'}`}</div>
      <button class="modal-close" onclick="closeSwap()">×</button>
    </div>
    <div class="modal-filters">`;
  for (const fb of filterButtons) {
    html += `<button class="filter-chip ${state.swapFilter === fb.key ? 'active' : ''}"
      onclick="setSwapFilter('${fb.key}')">${fb.label}</button>`;
  }
  html += `</div><div class="modal-list">`;

  for (const ex of filtered) {
    // skip if already in this day
    const alreadyIn = currentDay && !isAdd && currentDay.exercises.some(e => e.dbId === ex.id && e.id !== (currentEx ? currentEx.id : ''));
    const eqClasses = ex.eq.map(e => `<span class="eq-tag ${e}">${e === 'full' ? 'Full Gym' : e === 'db' ? 'DBs' : 'Bodyweight'}</span>`).join('');
    const swapPrimary = ex.muscles ? ex.muscles.primary.join(' · ') : '';
    html += `<div class="swap-item" onclick="selectSwap('${ex.id}')">
      <div style="flex:1;min-width:0">
        <div class="swap-item-name">${ex.name}</div>
        ${swapPrimary ? `<div style="font-size:11px;font-weight:700;color:var(--text2);margin-top:2px">${swapPrimary}</div>` : ''}
        <div style="font-size:11px;color:var(--text3);margin-top:1px">${ex.note || ''}</div>
      </div>
      <div class="swap-item-tags" style="flex-shrink:0">${eqClasses}</div>
    </div>`;
  }
  html += `</div></div>`;
  return html;
}

// ─── ACTIONS ─────────────────────────────────────────────────
function changeWeek(dir) {
  const currentWeek = getCurrentWeek();
  const base = state.viewWeek !== null ? state.viewWeek : currentWeek;
  const next = base + dir;
  if (next < 1) return;
  state.viewWeek = next === currentWeek ? null : next;
  state.openDay = null; // close open cards when navigating
  render();
}

function jumpToToday() {
  state.viewWeek = null;
  state.openDay = null;
  render();
}

function setTab(tab) {
  state.activeTab = tab;
  render();
}

function toggleDay(dayId) {
  state.openDay = state.openDay === dayId ? null : dayId;
  render();
}

function toggleEditMode() {
  state.editMode = !state.editMode;
  render();
}

function toggleGuide(id) {
  state.guideExpanded[id] = !state.guideExpanded[id];
  saveState();
  const el = document.getElementById(`guide-${id}`);
  if (el) el.classList.toggle('open', !!state.guideExpanded[id]);
}

function toggleSet(week, dayId, exId, idx, count) {
  const key = getStorageKey(week, dayId);
  if (!state.progress[key]) state.progress[key] = {};
  if (!state.progress[key][exId]) {
    state.progress[key][exId] = Array.from({length: count}, () => ({done: false, weight: ''}));
  }
  while (state.progress[key][exId].length < count) {
    state.progress[key][exId].push({done: false, weight: ''});
  }
  state.progress[key][exId][idx].done = !state.progress[key][exId][idx].done;
  saveState();
  // lightweight re-render of just the set button
  const setBtn = document.querySelector(`#exrow-${dayId}-${exId} .sets-grid .set-btn:nth-child(${idx + 1})`);
  if (setBtn) {
    setBtn.classList.toggle('done', state.progress[key][exId][idx].done);
  }
  // update header count
  const week2 = getCurrentWeek();
  const day = getDayDef(dayId);
  const dayData = state.progress[key] || {};
  const doneCount = day.exercises.reduce((acc, ex) => {
    const sets = (dayData[ex.id] || []).filter(s => s.done).length;
    return acc + sets;
  }, 0);
  const totalSets = day.exercises.reduce((a, ex) => a + ex.sets, 0);
  const meta = document.querySelector(`#card-${dayId} .day-meta`);
  if (meta) meta.textContent = `${day.label} · ${TYPE_LABELS[day.type]} · ${doneCount}/${totalSets} sets`;
}

function updateWeight(week, dayId, exId, idx, count, val) {
  const key = getStorageKey(week, dayId);
  if (!state.progress[key]) state.progress[key] = {};
  if (!state.progress[key][exId]) {
    state.progress[key][exId] = Array.from({length: count}, () => ({done: false, weight: ''}));
  }
  while (state.progress[key][exId].length < count) {
    state.progress[key][exId].push({done: false, weight: ''});
  }
  state.progress[key][exId][idx].weight = val;
  saveState();
}

function updateExNote(noteKey, val) {
  state.exNotes[noteKey] = val;
  saveState();
}

function updateSessionNote(week, dayId, val) {
  const key = getStorageKey(week, dayId);
  state.sessionNotes[key] = val;
  saveState();
}

function updateWeekNote(week, val) {
  state.weekNotes[`w${week}`] = val;
  saveState();
}

// ─── SWAP SYSTEM ─────────────────────────────────────────────
function openSwap(dayId, exId) {
  state.swapTarget = { dayId, exId };
  // auto-set filter to the day's type
  const day = getDayDef(dayId);
  if (day) {
    const typeMap = { push:'push', pull:'pull', legs:'legs', perf:'perf', def:'push' };
    state.swapFilter = typeMap[day.type] || 'all';
  }
  render();
}

function closeSwap() {
  state.swapTarget = null;
  render();
}

function setSwapFilter(f) {
  state.swapFilter = f;
  const modal = document.getElementById('swap-modal');
  if (modal) modal.innerHTML = renderSwapModalContent();
  // re-attach modal close
  modal.onclick = function(e) {
    if (e.target === modal) closeSwap();
  };
}

function selectSwap(dbExId) {
  const target = state.swapTarget;
  if (!target) return;

  const day = getDayDef(target.dayId);
  if (!day) return closeSwap();

  if (!state.customDays[target.dayId]) {
    // clone the day
    state.customDays[target.dayId] = {
      exercises: day.exercises.map(e => ({...e}))
    };
  }

  const exList = state.customDays[target.dayId].exercises;

  if (target.exId === null) {
    // ADD mode
    const dbEx = dbById(dbExId);
    const newEx = {
      id: `custom-${Date.now()}`,
      dbId: dbExId,
      kind: 'acc',
      sets: 3,
      logWeight: true,
      note: dbEx ? dbEx.note : '',
    };
    exList.push(newEx);
  } else {
    // SWAP mode
    const idx = exList.findIndex(e => e.id === target.exId);
    if (idx !== -1) {
      const dbEx = dbById(dbExId);
      exList[idx] = {
        ...exList[idx],
        dbId: dbExId,
        note: dbEx ? dbEx.note : '',
      };
    }
  }

  saveState();
  state.swapTarget = null;
  render();
}

function removeExercise(dayId, exId) {
  if (!state.customDays[dayId]) {
    const day = getDayDef(dayId);
    state.customDays[dayId] = {
      exercises: day.exercises.map(e => ({...e}))
    };
  }
  state.customDays[dayId].exercises = state.customDays[dayId].exercises.filter(e => e.id !== exId);
  saveState();
  render();
}

// ─── RUNNING ─────────────────────────────────────────────────
function updateRunForm(field, val) {
  state.runForm[field] = val;
}

function calcPace(dist, unit, time) {
  if (!dist || !time) return null;
  const d = parseFloat(dist);
  if (!d || isNaN(d)) return null;
  const parts = time.split(':').map(Number);
  let secs = 0;
  if (parts.length === 2) secs = parts[0] * 60 + parts[1];
  else if (parts.length === 3) secs = parts[0] * 3600 + parts[1] * 60 + parts[2];
  if (!secs) return null;
  const pacePerUnit = secs / d;
  const m = Math.floor(pacePerUnit / 60);
  const s = Math.round(pacePerUnit % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function logRun() {
  const rf = state.runForm;
  if (!rf.dist) { alert('Enter a distance.'); return; }
  const run = {
    id: `run-${Date.now()}`,
    date: new Date().toISOString(),
    dist: rf.dist,
    unit: rf.unit,
    time: rf.time,
    surface: rf.surface,
    feel: rf.feel,
    notes: rf.notes,
  };
  state.runs.push(run);
  state.runForm = { dist:'', unit:'mi', time:'', surface:'road', feel:'good', notes:'' };
  saveState();
  render();
}

function deleteRun(id) {
  state.runs = state.runs.filter(r => r.id !== id);
  saveState();
  render();
}

// ─── INIT ────────────────────────────────────────────────────
loadState();
render();

// Save on page hide/close (iOS fires pagehide, not beforeunload)
window.addEventListener('pagehide', saveState);
window.addEventListener('beforeunload', saveState);
window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveState();
});

// Register service worker for PWA persistence
if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'ff-v2-cache-v1';
self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE).then(c => c.addAll(['./']))
  );
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    )
  );
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  e.respondWith(
    caches.match(e.request).then(r => r || fetch(e.request).then(res => {
      if (res.ok && e.request.method === 'GET') {
        const clone = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
      }
      return res;
    }).catch(() => caches.match('./') ))
  );
});
  `.trim();
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl, { scope: './' })
    .catch(() => {}); // silently fail if not on HTTPS/localhost
}
</script>
</body>
